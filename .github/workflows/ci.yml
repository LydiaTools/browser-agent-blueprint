name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm run build:builder
      - run: git diff --exit-code -- builder/source-data.js
      - run: npm test
      - run: npm run metrics
      - run: npm run assemble -- content
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:builder
      - run: npm run demo
      - run: npm run demo:prepare
      - run: npm run demo:resume
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: blueprint-browser-evidence
          path: runs/
          if-no-files-found: error
