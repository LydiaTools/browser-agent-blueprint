name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm run build:builder
      - run: git diff --exit-code -- builder/source-data.js
      - run: npm run build:skill
      - run: git diff --exit-code -- skills/browser-task-recovery/references skills/browser-task-recovery/LICENSE
      - run: npm test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: checkpoint-file-kill-evidence
          path: runs/checkpoint-kill.json
          if-no-files-found: error
      - run: npm run metrics
      - run: npm run assemble -- content
      - name: Prepare pinned skill installer
        run: npm install --prefix "$RUNNER_TEMP/blueprint-skills-cli" --ignore-scripts --no-audit --no-fund skills@1.7.4
      - name: Verify isolated Codex skill installation
        run: npm run test:skill-install
        env:
          BLUEPRINT_SKILLS_CLI: ${{ runner.temp }}/blueprint-skills-cli/node_modules/skills/bin/cli.mjs
          DISABLE_TELEMETRY: '1'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: skill-install-evidence
          path: runs/skill-install-*.json
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:builder
      - run: npm run test:lost-reply
      - run: npm run demo
      - run: npm run demo:prepare
      - run: npm run demo:resume
      - run: npm run demo:crash-boundaries
      - run: npm run demo:browser-kill
      - run: npm run demo:write-ahead
      - run: npm run demo:session-isolation
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: blueprint-browser-evidence
          path: runs/
          if-no-files-found: error
